[package]
name = "tianedge-cpu"
version = "0.1.0"
edition = "2021"
description = "Deterministic TIAN-ISA v1 educational CPU execution engine for TIANEDGE (compiled to WebAssembly)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
