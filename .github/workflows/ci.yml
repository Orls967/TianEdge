name: TIANEDGE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-cpu-engine:
    name: Rust CPU Core (cargo test & wasm32 check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --manifest-path crates/tianedge-cpu/Cargo.toml
      - run: cargo check --manifest-path crates/tianedge-cpu/Cargo.toml --target wasm32-unknown-unknown

  python-api:
    name: Python FastAPI Service (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -e "services/api[dev]"
      - run: pytest services/api

  web-frontend:
    name: Frontend Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run test
      - run: npm --prefix apps/web run build
