<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-label="TIANEDGE 6-Stage Core Datapath">
  <rect width="880" height="340" fill="#070A10" rx="10"/>
  <rect x="16" y="16" width="848" height="308" fill="#0D121C" stroke="#334155" stroke-width="1" rx="8"/>
  <text x="36" y="46" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="16" font-weight="700">TIANEDGE 6-Stage Core Datapath &amp; Control Signals</text>
  <text x="36" y="66" fill="#94A3B8" font-family="monospace" font-size="11">Cyan = Data / Address Bus  |  Gold = Control Unit Assertions (Sequential CPI = 6)</text>
  <g font-family="monospace" font-size="12" text-anchor="middle">
    <rect x="40" y="120" width="110" height="72" rx="6" fill="#141B29" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="95" y="150" fill="#F8FAFC" font-weight="600">1. FETCH</text>
    <text x="95" y="168" fill="#22D3EE" font-size="10">PC -&gt; L1i -&gt; IR</text>

    <rect x="176" y="120" width="110" height="72" rx="6" fill="#141B29" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="231" y="150" fill="#F8FAFC" font-weight="600">2. DECODE</text>
    <text x="231" y="168" fill="#FBBF24" font-size="10">Decoder + CU</text>

    <rect x="312" y="120" width="110" height="72" rx="6" fill="#141B29" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="367" y="150" fill="#F8FAFC" font-weight="600">3. REG READ</text>
    <text x="367" y="168" fill="#22D3EE" font-size="10">R0..R7 OpA/OpB</text>

    <rect x="448" y="120" width="110" height="72" rx="6" fill="#141B29" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="503" y="150" fill="#F8FAFC" font-weight="600">4. EXECUTE</text>
    <text x="503" y="168" fill="#22D3EE" font-size="10">ALU + FLAGS</text>

    <rect x="584" y="120" width="116" height="72" rx="6" fill="#141B29" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="642" y="150" fill="#F8FAFC" font-weight="600">5. MEM ACCESS</text>
    <text x="642" y="168" fill="#22D3EE" font-size="10">LSU MAR/MDR L1d</text>

    <rect x="726" y="120" width="114" height="72" rx="6" fill="#141B29" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="783" y="150" fill="#F8FAFC" font-weight="600">6. WRITE BACK</text>
    <text x="783" y="168" fill="#FBBF24" font-size="10">Commit Rd + PC+1</text>
  </g>
  <g stroke="#22D3EE" stroke-width="2" fill="none">
    <path d="M150 156 L176 156"/>
    <path d="M286 156 L312 156"/>
    <path d="M422 156 L448 156"/>
    <path d="M558 156 L584 156"/>
    <path d="M700 156 L726 156"/>
    <path d="M503 192 L503 230 L783 230 L783 192" stroke-dasharray="5 4" stroke="#F59E0B"/>
  </g>
  <text x="643" y="248" fill="#F59E0B" font-family="monospace" font-size="11" text-anchor="middle">ALU Bypass Path (Stage 5 bypassed on arithmetic ops)</text>
  <rect x="176" y="266" width="524" height="36" rx="6" fill="#1E293B" stroke="#FBBF24" stroke-width="1"/>
  <text x="438" y="289" fill="#FBBF24" font-family="monospace" font-size="12" text-anchor="middle">Control Unit Signals: PCWrite | IRWrite | RegWrite | MemRead | MemWrite | ALUOp | BranchTaken</text>
</svg>
