<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-label="Modified Harvard Memory Map">
  <rect width="880" height="340" fill="#070A10" rx="10"/>
  <rect x="16" y="16" width="848" height="308" fill="#0D121C" stroke="#334155" stroke-width="1" rx="8"/>
  <text x="36" y="46" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="16" font-weight="700">Modified Harvard Educational Memory Architecture (TIAN-ISA v1)</text>
  <rect x="48" y="88" width="230" height="190" rx="8" fill="#141B29" stroke="#00E5FF" stroke-width="1.5"/>
  <text x="163" y="114" fill="#00E5FF" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">Instruction Memory [0..255]</text>
  <text x="163" y="140" fill="#CBD5E1" font-family="monospace" font-size="11" text-anchor="middle">0: LOAD R1, 10</text>
  <text x="163" y="162" fill="#CBD5E1" font-family="monospace" font-size="11" text-anchor="middle">1: LOAD R2, 20</text>
  <text x="163" y="184" fill="#CBD5E1" font-family="monospace" font-size="11" text-anchor="middle">2: ADD R3, R1, R2</text>
  <text x="163" y="206" fill="#CBD5E1" font-family="monospace" font-size="11" text-anchor="middle">3: STORE R3, 100</text>
  <text x="163" y="250" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Read-only by PC (L1i Fetch)</text>

  <rect x="340" y="110" width="200" height="145" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="440" y="145" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Processing Core</text>
  <text x="440" y="172" fill="#FBBF24" font-family="monospace" font-size="11" text-anchor="middle">PC -&gt; Fetch Port</text>
  <text x="440" y="196" fill="#22D3EE" font-family="monospace" font-size="11" text-anchor="middle">MAR/MDR -&gt; LSU Data Port</text>
  <text x="440" y="226" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Zero code-overwrite hazard</text>

  <rect x="602" y="88" width="230" height="190" rx="8" fill="#141B29" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="717" y="114" fill="#22D3EE" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">Data Memory [0..255]</text>
  <text x="717" y="146" fill="#CBD5E1" font-family="monospace" font-size="11" text-anchor="middle">32-bit signed i32 cells</text>
  <text x="717" y="182" fill="#10B981" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">MEM[100] = 30</text>
  <text x="717" y="220" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Read/written via LOAD [addr]</text>
  <text x="717" y="238" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">&amp; STORE Rs, addr</text>

  <path d="M278 165 L340 165" stroke="#00E5FF" stroke-width="2"/>
  <path d="M540 192 L602 192" stroke="#22D3EE" stroke-width="2"/>
</svg>
